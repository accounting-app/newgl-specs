# Self-hosting package (Phase E, see ../INSTANCE_ARCHITECTURE_PLAN.md).
#
# Copy this file (and generate-secrets.sh) into the parent folder that
# contains newgl-api/, newgl-ai/, and quickslike/ as sibling directories,
# then run from there -- see ../SELF_HOSTING_SETUP.md for the full walkthrough.
#
# Postgres + Auth are NOT defined here. They come from the Supabase CLI's
# own local stack (`bunx supabase start`, run from newgl-api/) -- reusing
# infrastructure this whole project already runs on for local dev, rather
# than vendoring Supabase's full self-host bundle (Storage/Realtime/imgproxy/
# etc. that New GL never uses). Run `bunx supabase start` BEFORE
# `docker compose up`.

services:
  newgl-api:
    build:
      context: ./newgl-api
      args:
        BUN_VERSION: "1.3.13"
    ports:
      - "3001:3001"
    environment:
      APP_ENV: local
      PORT: "3001"
      COMPANY: "${COMPANY:-My Company}"
      LEDGER_FILE: data/company.bean
      ACCOUNTING_BASIS: cash
      # host.docker.internal reaches the Supabase CLI stack running on the
      # host machine (outside this compose project) -- see the comment above.
      SUPABASE_URL: http://host.docker.internal:54321
      # The local Supabase CLI always stamps JWTs with iss=http://127.0.0.1:54321/auth/v1,
      # regardless of the URL any given service used to reach it -- this has
      # to match that exactly, not the host.docker.internal address above,
      # or every request 401s (see newgl-api's configuration/index.ts,
      # SUPABASE_JWT_ISSUER).
      SUPABASE_JWT_ISSUER: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      # newgl-ai is reached by its compose service name -- normal
      # container-to-container DNS on the shared network below.
      NEWGL_AI_URL: http://newgl-ai:3002
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?run generate-secrets.sh first}"
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (Mac/Windows);
      # this line is what makes it also resolve on Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      - newgl-ai

  newgl-ai:
    build:
      context: ./newgl-ai
      args:
        BUN_VERSION: "1.3.13"
    # Deliberately no `ports:` here -- matches production's "no public IP"
    # design (see INSTANCE_PROVISIONING_RUNBOOK.md gotcha #5). Only
    # newgl-api, on the same compose network, can reach it.
    environment:
      APP_ENV: local
      PORT: "3002"
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?run generate-secrets.sh first}"
      AI_KEY_ENCRYPTION_KEY: "${AI_KEY_ENCRYPTION_KEY:?run generate-secrets.sh first}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4-8}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  quickslike:
    build:
      context: ./quickslike
      args:
        BUN_VERSION: "1.3.13"
        # NEXT_PUBLIC_* vars are inlined into the browser bundle at build
        # time -- these must be build args, not just runtime `environment:`
        # below (which only affects the server, and quickslike's env reads
        # happen client-side).
        NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
        # This is the Supabase CLI's well-known local anon key -- identical
        # on every `supabase start`, published in their own docs, not a
        # secret. Override via SUPABASE_ANON_KEY if your local stack ever
        # prints a different one.
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}"
        NEXT_PUBLIC_APP_ENV: local
        NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
    ports:
      - "3010:3010"
    environment:
      # Server-only override (see quickslike's src/configuration/index.ts,
      # SUPABASE_SERVER_URL). quickslike's own Next.js server runs inside
      # this container, where "localhost" means the container itself, not
      # the host running Supabase -- unlike the browser, which really is on
      # the host and correctly uses the NEXT_PUBLIC_SUPABASE_URL build arg
      # above. Without this, session cookies get set client-side but the
      # server-side middleware can never verify them, and every login
      # bounces straight back to /login.
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - newgl-api
